<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dreamspace &middot; run inspector</title>
<!-- Inline so the page makes no request the local server cannot answer. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#x1F9CA;</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --bg:#0d0d10; --panel:#141419; --sunk:#101014; --line:#26262e; --line-hi:#34343e;
    --fg:#e8e8ea; --dim:#8a8a94; --dimmer:#5c5c66;
    --accent:#6ea8fe; --accent-bg:#1f2733; --warn:#e5a05a; --bad:#e57373;
    --flat:#9d7fe0;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
    font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
    display:grid; grid-template-columns:244px minmax(0,1fr) 330px;
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"runs stage detail" "runs strip detail";
  }
  button, input { font:inherit; color:inherit; }
  h2 { margin:0; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase;
       color:var(--dim); font-weight:600; }
  .muted { color:var(--dim); }
  .num { font-variant-numeric:tabular-nums; }

  /* ---- run list (left) --------------------------------------------- */
  #runs { grid-area:runs; background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; min-height:0; }
  #runs > header { padding:13px 14px 11px; border-bottom:1px solid var(--line); }
  #runs h1 { margin:0; font-size:14px; font-weight:600;
             display:flex; justify-content:space-between; align-items:center; }
  #runs h1 span { color:var(--dim); font-weight:400; }
  #where { margin:3px 0 0; font-size:11px; color:var(--dimmer); word-break:break-all; }
  #runlist { flex:1; overflow-y:auto; padding:8px; }

  #new { padding:3px 9px; border-radius:6px; border:1px solid var(--line-hi);
         background:#1c1c23; cursor:pointer; font-size:12px; font-weight:500; }
  #new:hover { border-color:var(--accent); color:#cfe0ff; }
  #new[hidden] { display:none; }

  /* ---- new-job form ------------------------------------------------ */
  #compose { display:none; padding:11px 12px 13px; border-bottom:1px solid var(--line);
             background:var(--sunk); }
  #compose.on { display:block; }
  #pick { display:grid; place-items:center; gap:4px; padding:16px 10px;
          border:1.5px dashed var(--line-hi); border-radius:8px; cursor:pointer;
          color:var(--dim); text-align:center; font-size:11.5px; }
  #pick:hover, #pick.over { border-color:var(--accent); color:#cfe0ff; }
  #pick img { max-width:100%; max-height:96px; border-radius:5px; }
  #compose .row { display:flex; gap:6px; margin-top:9px; }
  #compose .row button { flex:1; padding:5px 0; border-radius:6px; cursor:pointer;
                         border:1px solid var(--line-hi); background:#1c1c23; }
  #compose .row button[aria-pressed="true"] { background:var(--accent-bg);
                         border-color:var(--accent); color:#cfe0ff; }
  #opts { margin-top:9px; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #opts label { display:flex; flex-direction:column; gap:2px; font-size:10.5px;
                color:var(--dim); }
  #opts input, #opts select { padding:4px 6px; border-radius:5px;
                border:1px solid var(--line-hi); background:#101014; }
  #opts .full { grid-column:1 / -1; }
  #go { width:100%; margin-top:10px; padding:7px 0; border-radius:6px;
        border:1px solid var(--accent); background:var(--accent-bg); color:#cfe0ff;
        font-weight:600; cursor:pointer; }
  #go:disabled { opacity:.45; cursor:default; }
  #composeerr { margin:8px 0 0; font-size:11px; color:#f0a2a2; }

  /* ---- job cards --------------------------------------------------- */
  #joblist { padding:8px 8px 0; max-height:46%; overflow-y:auto; }
  #joblist:empty { display:none; }
  .job { border:1px solid var(--line); border-radius:8px; background:var(--sunk);
         padding:8px 9px; margin-bottom:8px; }
  .job.running { border-color:#3d5580; }
  .job.failed { border-color:#5a3030; }
  .job header { display:flex; gap:8px; align-items:center; }
  .job img { width:34px; height:28px; object-fit:cover; border-radius:4px;
             border:1px solid var(--line); }
  .job .who { flex:1; min-width:0; }
  .job .who b { display:block; font-size:12px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  .job .who small { color:var(--dim); font-size:10.5px; }
  .job button { padding:2px 7px; font-size:11px; border-radius:5px; cursor:pointer;
                border:1px solid var(--line-hi); background:#1c1c23; }
  .job .stage { margin-top:6px; font-size:11px; color:var(--accent); }
  .job .stage.spin::after { content:'…'; }
  .job pre { margin:6px 0 0; padding:6px 7px; border-radius:5px; background:#0a0a0d;
             color:var(--dim); font:10.5px/1.45 ui-monospace,Consolas,monospace;
             max-height:96px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .job .err { margin-top:6px; font-size:11px; color:#f0a2a2; word-break:break-word; }

  .run { display:flex; gap:10px; padding:8px; border-radius:8px; cursor:pointer;
         border:1px solid transparent; align-items:center; }
  .run:hover { background:#1b1b22; }
  .run[aria-current="true"] { background:var(--accent-bg); border-color:#33405a; }
  .run .thumb { width:46px; height:38px; flex:0 0 auto; border-radius:5px;
                background:var(--sunk); object-fit:cover; display:grid;
                place-items:center; color:var(--dimmer); font-size:16px;
                border:1px solid var(--line); }
  .run .meta { min-width:0; }
  .run b { display:block; font-weight:600; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .run small { color:var(--dim); font-size:11px; }

  .tag { display:inline-block; padding:0 5px; border-radius:4px; font-size:10px;
         line-height:15px; letter-spacing:.3px; background:#23232c; color:var(--dim);
         vertical-align:1px; }
  .tag.room { background:#1e3050; color:#9dc0ff; }
  .tag.object { background:#1f3b2c; color:#8fd3a8; }
  .tag.scene { background:#3a3050; color:#c3aef0; }
  .tag.images { background:#3a3226; color:#e0bc8a; }
  .tag.billboard { background:#2e2450; color:#c3aef0; }
  .tag.dropped, .tag.orphan { background:#402424; color:#f0a2a2; }

  /* ---- stage (centre top) ------------------------------------------ */
  #stage { grid-area:stage; position:relative; min-width:0; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:absolute; top:0; left:0; height:2px; width:0;
         background:var(--accent); transition:width .12s linear; }
  #crumb { position:absolute; top:10px; left:12px; display:flex; gap:6px;
           align-items:baseline; padding:4px 10px; border-radius:6px;
           background:rgba(13,13,16,.72); backdrop-filter:blur(6px); }
  #crumb b { font-weight:600; }
  #crumb small { color:var(--dim); }

  #tools { position:absolute; top:10px; right:12px; display:flex; flex-wrap:wrap;
           justify-content:flex-end; gap:6px; max-width:64%; }
  #tools button, #tools label {
    display:inline-flex; align-items:center; gap:6px; padding:4px 9px;
    background:rgba(20,20,25,.86); border:1px solid var(--line-hi);
    border-radius:6px; cursor:pointer; user-select:none; white-space:nowrap;
    backdrop-filter:blur(6px);
  }
  #tools button:hover, #tools label:hover { border-color:#4a4a58; }
  #tools button[aria-pressed="true"] { background:var(--accent-bg);
                                       border-color:var(--accent); color:#cfe0ff; }
  #tools kbd { color:var(--dimmer); font:11px/1 ui-monospace,Consolas,monospace; }
  #tools input[type=range] { width:80px; accent-color:var(--accent); }

  #msg { position:absolute; left:12px; bottom:10px; font-size:11.5px;
         color:var(--dim); padding:3px 9px; border-radius:6px;
         background:rgba(13,13,16,.72); backdrop-filter:blur(6px); }
  #msg:empty { display:none; }
  #msg.err { color:#ff8a8a; }
  #blank { position:absolute; inset:0; display:none; place-items:center;
           color:var(--dim); text-align:center; padding:40px; }
  #blank.on { display:grid; }
  #drop { position:absolute; inset:0; display:none; place-items:center;
          background:rgba(13,13,16,.82); border:2px dashed var(--accent);
          font-size:15px; pointer-events:none; }
  body.dragging #drop { display:grid; }

  /* ---- pipeline strip (centre bottom) ------------------------------ */
  #strip { grid-area:strip; border-top:1px solid var(--line); background:var(--panel);
           padding:9px 12px 11px; min-width:0; }
  #striphead { display:flex; justify-content:space-between; align-items:baseline;
               margin-bottom:8px; gap:12px; }
  #stripscroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
                 align-items:stretch; }
  #stripscroll::-webkit-scrollbar { height:8px; }
  #stripscroll::-webkit-scrollbar-thumb { background:#2c2c36; border-radius:4px; }

  .step { flex:0 0 auto; width:112px; border:1px solid var(--line); border-radius:8px;
          background:var(--sunk); cursor:pointer; overflow:hidden;
          display:flex; flex-direction:column; }
  .step:hover { border-color:#41414e; }
  .step[aria-current="true"] { border-color:var(--accent); background:var(--accent-bg); }
  .step .pic { height:66px; background:#0a0a0d; display:grid; place-items:center;
               color:var(--dimmer); font-size:20px; overflow:hidden; }
  .step .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .step .cap { padding:5px 7px 6px; border-top:1px solid var(--line); }
  .step .cap b { display:block; font-size:11.5px; font-weight:600; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .step .cap small { color:var(--dim); font-size:10px; }
  .step.wide { width:132px; }
  .step.dropped .pic img { opacity:.45; filter:grayscale(.6); }

  .arrow { flex:0 0 auto; align-self:center; color:var(--dimmer); padding:0 2px;
           font-size:15px; }
  .phase { flex:0 0 auto; align-self:stretch; display:flex; align-items:center;
           writing-mode:vertical-rl; transform:rotate(180deg); color:var(--dimmer);
           font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; }

  /* ---- detail (right) ---------------------------------------------- */
  #detail { grid-area:detail; background:var(--panel); border-left:1px solid var(--line);
            overflow-y:auto; padding:13px 14px 24px; }
  #detail section { margin-bottom:18px; }
  #detail section > h2 { margin-bottom:7px; }

  .photo { position:relative; border-radius:7px; overflow:hidden;
           border:1px solid var(--line); background:var(--sunk); }
  .photo img { display:block; width:100%; }
  .photo svg { position:absolute; inset:0; width:100%; height:100%; }
  /* The viewBox is in source pixels and the element is a few hundred wide, so
     stroke widths have to opt out of that scaling or they vanish. */
  .photo rect { fill:none; stroke:#ffffff70; stroke-width:1; cursor:pointer;
                vector-effect:non-scaling-stroke; }
  .photo rect:hover { stroke:#fff; }
  .photo rect.on { stroke:var(--accent); stroke-width:2.5; fill:#6ea8fe24; }
  .photo rect.gone { stroke:#e5737399; stroke-dasharray:4 3; }
  .cropimg { display:block; width:100%; border-radius:7px; border:1px solid var(--line);
             background:var(--sunk); }
  .caption { margin:5px 0 0; font-size:11px; color:var(--dim); }

  dl.kv { margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; }
  dl.kv dt { color:var(--dim); }
  dl.kv dd { margin:0; text-align:right; font-variant-numeric:tabular-nums;
             overflow:hidden; text-overflow:ellipsis; }
  dl.kv dd.warnv { color:var(--warn); }
  .note { margin:7px 0 0; padding:7px 9px; border-radius:6px; font-size:11.5px;
          background:#231d16; border:1px solid #3d3122; color:#e0bc8a; }
  .note.bad { background:#2a1c1c; border-color:#4a2c2c; color:#f0a2a2; }
  .empty { color:var(--dim); }
</style>
</head>
<body>

<aside id="runs">
  <header>
    <h1>dreamspace <span>&middot; runs</span>
      <button id="new" hidden>+ New</button></h1>
    <p id="where"></p>
  </header>

  <form id="compose" autocomplete="off">
    <div id="pick">
      <div id="pickface">Drop an image, or click to choose</div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div class="row">
      <button type="button" id="k-object" aria-pressed="true">Single object</button>
      <button type="button" id="k-room" aria-pressed="false">Whole room</button>
      <button type="button" id="k-cloud" aria-pressed="false"
              title="Hunyuan3D-2.1 on a rented Modal GPU. Needs `modal setup`; billed per second.">Cloud GPU</button>
    </div>
    <div id="opts"></div>
    <button id="go" type="submit" disabled>Generate</button>
    <p id="composeerr" hidden></p>
  </form>

  <div id="joblist"></div>
  <div id="runlist"><p class="empty" style="padding:14px">Loading&hellip;</p></div>
</aside>

<main id="stage">
  <canvas id="canvas"></canvas>
  <div id="bar"></div>
  <div id="crumb"></div>
  <div id="tools">
    <button id="t-rotate" aria-pressed="false">Spin <kbd>R</kbd></button>
    <button id="t-wire"   aria-pressed="false">Wire <kbd>W</kbd></button>
    <button id="t-grid"   aria-pressed="true">Grid <kbd>G</kbd></button>
    <button id="t-bbox"   aria-pressed="false">Bounds <kbd>B</kbd></button>
    <button id="t-env"    aria-pressed="false">Backdrop <kbd>E</kbd></button>
    <button id="t-fit">Fit <kbd>F</kbd></button>
    <label>Exposure <input id="exposure" type="range" min="0.2" max="3" step="0.05" value="1.4"></label>
  </div>
  <div id="msg"></div>
  <div id="blank"></div>
  <div id="drop">Drop a <b>.glb</b> to inspect it, or an <b>image</b> to build from it</div>
</main>

<section id="strip">
  <div id="striphead">
    <h2>Pipeline</h2>
    <span class="muted" id="striphint"></span>
  </div>
  <div id="stripscroll"></div>
</section>

<aside id="detail"></aside>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }     from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* ====================================================================
   3D stage
   ==================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Reconstruction bakes shading into the albedo, so these textures are already
// dark; ACES darkens them further and 1.0 lands too dim to read the geometry.
renderer.toneMappingExposure = 1.4;

const scene = new THREE.Scene();
const VOID = new THREE.Color(0x0d0d10);
scene.background = VOID;

// An image-based environment is what makes a raw untextured mesh readable:
// point lights alone flatten reconstruction artefacts into noise.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// A pale studio sweep to switch to. Reconstructed meshes are often nearly
// black, and a black silhouette on a black page tells you nothing about shape.
// (The environment map itself is unusable here: PMREM output is a mip chain,
// and three draws it as a near-black backdrop.)
const BACKDROP = (() => {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#e9e9ee');
  g.addColorStop(1, '#7c7c88');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

// Two directionals on top of the environment: a key for edge definition and a
// weaker fill, so the side facing away from the key is shaded rather than black.
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(-4, 2, -3);
scene.add(fill);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2a30, 0.5));

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(2, 1.6, 3);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotateSpeed = 1.6;

const loader = new GLTFLoader();
// Nothing this project writes is Draco-compressed, but GLBs from elsewhere get
// dropped on this page too, and the decoder is only fetched if one needs it.
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

let current = null, grid = null, box = null, wireframe = false;

function disposeCurrent() {
  if (!current) return;
  // Meshes here run to millions of triangles; letting the GC decide when to
  // release GPU buffers exhausts VRAM after a handful of scene swaps.
  current.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    for (const m of [].concat(o.material || [])) {
      for (const v of Object.values(m)) v?.isTexture && v.dispose();
      m.dispose();
    }
  });
  scene.remove(current);
  current = null;
}

function frameObject(object, instant = false) {
  const bounds = new THREE.Box3().setFromObject(object);
  const size = bounds.getSize(new THREE.Vector3());
  const centre = bounds.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-3);
  // Pull back far enough that the bounding sphere fits the vertical FOV.
  const dist = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.25;
  const dir = instant ? new THREE.Vector3(0.9, 0.55, 1).normalize()
                      : camera.position.clone().sub(controls.target).normalize();
  camera.near = Math.max(radius / 500, 0.001);
  camera.far = radius * 200;
  camera.updateProjectionMatrix();
  camera.position.copy(centre).addScaledVector(dir, dist);
  controls.target.copy(centre);
  controls.update();
  return { bounds, size, centre };
}

function rebuildHelpers(size, bounds, centre) {
  grid && scene.remove(grid);
  box && scene.remove(box);
  // Scenes are authored in metres, so a 1 m cell is a real measurement - until
  // the model is small enough that metre cells would be a single square.
  const span = Math.max(size.x, size.z, 0.5);
  const step = span > 4 ? 1 : span > 1 ? 0.25 : 0.1;
  const cells = Math.ceil((span * 1.6) / step);
  grid = new THREE.GridHelper(cells * step, cells, 0x3a3a46, 0x22222a);
  // Under the model rather than at the world origin - an assembled scene is
  // not necessarily centred there, and a floor off to one side reads as a bug.
  grid.position.set(centre.x, bounds.min.y, centre.z);
  grid.material.transparent = true;
  grid.material.opacity = 0.65;
  grid.visible = $('t-grid').getAttribute('aria-pressed') === 'true';
  scene.add(grid);
  box = new THREE.Box3Helper(bounds, new THREE.Color(0x6ea8fe));
  box.visible = $('t-bbox').getAttribute('aria-pressed') === 'true';
  scene.add(box);
}

function applyWireframe() {
  current?.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) m.wireframe = wireframe;
  });
}

function summarise(object, size) {
  let tris = 0, verts = 0, meshes = 0, textured = 0;
  const materials = new Set();
  object.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    verts += g.attributes.position?.count || 0;
    tris += g.index ? g.index.count / 3 : (g.attributes.position?.count || 0) / 3;
    for (const m of [].concat(o.material)) {
      materials.add(m.uuid);
      if (m.map) textured++;
    }
  });
  return { tris, verts, meshes, materials: materials.size, textured, size };
}

const n = (v) => Math.round(v).toLocaleString('en-US');
const metres = (v) => (Math.abs(v) >= 1 ? v.toFixed(2) + ' m' : (v * 100).toFixed(1) + ' cm');
const mb = (b) => (b / 1e6).toFixed(b < 1e5 ? 2 : 1) + ' MB';

function say(text, isError = false) {
  $('msg').textContent = text;
  $('msg').classList.toggle('err', isError);
}

let token = 0;                 // guards a slow load landing after a newer one
let meshFacts = null;          // stats for whatever is on the canvas now

async function load(url, label, bytes) {
  const mine = ++token;
  $('blank').classList.remove('on');
  $('bar').style.width = '0%';
  say('Loading ' + label + '…');
  const started = performance.now();
  try {
    const gltf = await loader.loadAsync(url, (e) => {
      if (e.lengthComputable) $('bar').style.width = (e.loaded / e.total * 100) + '%';
    });
    if (mine !== token) return;
    disposeCurrent();
    current = gltf.scene;
    scene.add(current);
    applyWireframe();
    const { bounds, size, centre } = frameObject(current, true);
    rebuildHelpers(size, bounds, centre);
    meshFacts = { ...summarise(current, size), bytes, ms: Math.round(performance.now() - started) };
    say(`Loaded in ${meshFacts.ms} ms`);
    renderDetail();
  } catch (err) {
    if (mine !== token) return;
    console.error(err);
    meshFacts = null;
    say('Could not load ' + label + ' — ' + err.message, true);
    renderDetail();
  } finally {
    if (mine === token) $('bar').style.width = '0%';
  }
}

function showBlank(text) {
  ++token;                     // cancel anything still downloading
  disposeCurrent();
  meshFacts = null;
  $('blank').textContent = text;
  $('blank').classList.add('on');
  say('');
}

/* ====================================================================
   state
   ==================================================================== */
const state = { runs: [], runId: null, itemName: null, signature: '' };

const runById = (id) => state.runs.find((r) => r.id === id);
const currentRun = () => runById(state.runId);
const currentItem = () => currentRun()?.items.find((i) => i.name === state.itemName);

function setHash() {
  const h = state.itemName ? `${state.runId}/${state.itemName}` : state.runId;
  const want = '#' + encodeURI(h ?? '');
  if (location.hash !== want) { suppressHash = true; location.hash = want; }
}
let suppressHash = false;

/* ---- run list ------------------------------------------------------ */
function runSubtitle(run) {
  const bits = [];
  if (run.kind === 'room' || run.kind === 'scene') {
    const placed = run.items.filter((i) => i.status === 'placed').length;
    bits.push(`${placed} object${placed === 1 ? '' : 's'}`);
  }
  if (run.kind === 'images') bits.push(`${run.items.length} images`);
  if (run.render) bits.push(mb(run.render.bytes));
  return bits.join(' · ');
}

function renderRuns() {
  $('runlist').innerHTML = state.runs.length ? state.runs.map((run) => `
    <div class="run" data-run="${esc(run.id)}" aria-current="${run.id === state.runId}">
      ${run.photo
        ? `<img class="thumb" src="${esc(run.photo.url)}" alt="">`
        : `<div class="thumb">${run.render ? '◈' : '▢'}</div>`}
      <div class="meta">
        <b>${esc(run.id)}</b>
        <small><span class="tag ${esc(run.kind)}">${esc(run.kind)}</span>
               ${esc(runSubtitle(run))}</small>
      </div>
    </div>`).join('')
    : '<p class="empty" style="padding:14px">Nothing in this folder yet — run '
      + '<code>dreamspace-room</code> or drop a .glb on the viewport.</p>';
}

/* ---- pipeline strip ------------------------------------------------ */
const STAGE_GLYPH = { mesh:'◈', billboard:'▤', image:'▦' };

function renderStrip() {
  const run = currentRun();
  if (!run) { $('stripscroll').innerHTML = ''; $('striphint').textContent = ''; return; }

  const cards = [];
  // 1. what was handed to the pipeline
  cards.push(`<div class="phase">provided</div>`);
  cards.push(run.photo ? `
    <div class="step wide" data-step="photo" aria-current="${!state.itemName}">
      <div class="pic"><img src="${esc(run.photo.url)}" alt=""></div>
      <div class="cap"><b>${esc(run.photo.name)}</b>
        <small>${run.photo.width ? `${run.photo.width}×${run.photo.height} px` : ''}</small></div>
    </div>` : `
    <div class="step wide" data-step="photo" aria-current="${!state.itemName}">
      <div class="pic">?</div>
      <div class="cap"><b>no source</b><small>not in inputs/</small></div>
    </div>`);

  // 2-3. what came out of detection, and what each one reconstructed into
  if (run.items.length) {
    cards.push(`<div class="arrow">→</div>`);
    cards.push(`<div class="phase">detected → built</div>`);
    for (const item of run.items) {
      const badge = item.status === 'dropped' ? '<span class="tag dropped">dropped</span>'
        : item.kind === 'billboard' ? '<span class="tag billboard">panel</span>'
        : item.status === 'orphan' ? '<span class="tag orphan">orphan</span>' : '';
      cards.push(`
        <div class="step ${item.status}" data-step="item" data-name="${esc(item.name)}"
             aria-current="${item.name === state.itemName}" title="${esc(item.name)}">
          <div class="pic">${item.crop
            ? `<img src="${esc(item.crop.url)}" alt="">`
            : (STAGE_GLYPH[item.kind] || '◈')}</div>
          <div class="cap"><b>${esc(item.name)}</b>
            <small>${badge || (item.mesh ? mb(item.mesh.bytes) : 'no mesh')}</small></div>
        </div>`);
    }
  }

  // 4. the single file the whole run exists to produce
  if (run.render) {
    cards.push(`<div class="arrow">→</div>`);
    cards.push(`<div class="phase">assembled</div>`);
    cards.push(`
      <div class="step wide" data-step="render" aria-current="${state.itemName === null && false}">
        <div class="pic">◆</div>
        <div class="cap"><b>${esc(run.render.path)}</b>
          <small>${mb(run.render.bytes)}</small></div>
      </div>`);
  }
  $('stripscroll').innerHTML = cards.join('');

  const dropped = run.items.filter((i) => i.status === 'dropped').length;
  const panels = run.items.filter((i) => i.kind === 'billboard').length;
  $('striphint').innerHTML = [
    run.items.length ? `${run.items.length} detected` : '',
    panels ? `${panels} flat → panel` : '',
    dropped ? `<span style="color:var(--bad)">${dropped} dropped</span>` : '',
  ].filter(Boolean).join(' &middot; ');
}

/* ---- the photo, with every detection drawn on it ------------------- */
function photoWithBoxes(run, activeName) {
  if (!run.photo) return '';
  const w = run.photo.width, h = run.photo.height;
  const boxes = run.items.filter((i) => i.box);
  const svg = (w && h && boxes.length) ? `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${boxes.map((i) => {
      const [x0, y0, x1, y1] = i.box;
      const cls = [i.name === activeName ? 'on' : '',
                   i.status === 'dropped' ? 'gone' : ''].filter(Boolean).join(' ');
      return `<rect class="${cls}" data-name="${esc(i.name)}" x="${x0}" y="${y0}"
                    width="${x1 - x0}" height="${y1 - y0}"><title>${esc(i.name)}</title></rect>`;
    }).join('')}</svg>` : '';
  return `<div class="photo">
      <img src="${esc(run.photo.url)}" alt="">${svg}
    </div>`;
}

function boxCaption(run) {
  if (!run.photo) return 'No matching image in inputs/.';
  const from = run.items.find((i) => i.box_from)?.box_from;
  if (!from) return `${run.photo.name} · ${run.photo.width}×${run.photo.height} px`;
  return from === 'detector'
    ? `${run.photo.name} · boxes as recorded by the detector`
    : `${run.photo.name} · boxes recovered by matching each crop back into the photo`;
}

/* ---- detail panel -------------------------------------------------- */
function kv(rows) {
  return `<dl class="kv">${rows.filter(Boolean).map(([k, v, cls]) =>
    `<dt>${esc(k)}</dt><dd class="${cls || ''}">${v}</dd>`).join('')}</dl>`;
}

function meshBlock(title) {
  if (!meshFacts) return '';
  const f = meshFacts;
  return `<section><h2>${title}</h2>${kv([
    ['Triangles', n(f.tris)],
    ['Vertices', n(f.verts)],
    ['Meshes', n(f.meshes)],
    ['Materials', n(f.materials)],
    ['Textured', f.textured ? `${f.textured}/${f.meshes}` : 'none'],
    ['Bounding box', `${metres(f.size.x)} × ${metres(f.size.y)} × ${metres(f.size.z)}`],
    f.bytes ? ['File', mb(f.bytes)] : null,
    ['Load time', f.ms + ' ms'],
  ])}</section>`;
}

function renderDetail() {
  const run = currentRun();
  if (!run) { $('detail').innerHTML = ''; return; }
  const item = currentItem();
  $('detail').innerHTML = item ? detailForItem(run, item) : detailForRun(run);

  // Clicking a box in the photo is the fastest way to ask "what became of
  // that?", so the overlay doubles as navigation.
  for (const rect of $('detail').querySelectorAll('.photo rect'))
    rect.addEventListener('click', () => selectItem(rect.dataset.name));
}

function detailForRun(run) {
  const room = run.spec?.room;
  const placed = run.items.filter((i) => i.status === 'placed');
  const dropped = run.items.filter((i) => i.status === 'dropped');
  const panels = placed.filter((i) => i.kind === 'billboard');
  return `
    <section>
      <h2>Provided</h2>
      ${photoWithBoxes(run, null)}
      <p class="caption">${esc(boxCaption(run))}</p>
    </section>
    ${room ? `<section><h2>Room</h2>${kv([
      ['Width', metres(room.width)],
      ['Depth', metres(room.depth)],
      ['Height', metres(room.height)],
      ['Walls built', (room.walls || []).join(', ') || 'none'],
      ['Ceiling', room.with_ceiling ? 'yes' : 'no'],
    ])}</section>` : ''}
    <section><h2>Run</h2>${kv([
      ['Kind', run.kind],
      run.items.length ? ['Detected', n(run.items.length)] : null,
      placed.length ? ['Placed', n(placed.length)] : null,
      panels.length ? ['Flat → panel', n(panels.length)] : null,
      dropped.length ? ['Dropped', n(dropped.length), 'warnv'] : null,
      run.render ? ['Output', esc(run.render.path)] : null,
      run.spec ? ['Spec', esc(run.spec.path)] : null,
    ])}
    ${dropped.length ? `<p class="note">Detected and reconstructed, but left out of
      the scene: <b>${dropped.map((d) => esc(d.name)).join(', ')}</b>. A mesh under
      200 faces is dropped rather than placed — it would claim a spot in the room
      and put a degenerate bounding box there.</p>` : ''}
    </section>
    ${meshBlock(run.items.length ? 'Assembled mesh' : 'Mesh')}
    ${run.items.length ? `<section><h2>Next</h2>
      <p class="caption">Pick an object below to trace it from the photograph
      through to its own mesh.</p></section>` : ''}`;
}

function detailForItem(run, item) {
  const dropped = item.status === 'dropped';
  const flat = item.kind === 'billboard';
  return `
    <section>
      <h2>From the photo</h2>
      ${photoWithBoxes(run, item.name)}
      <p class="caption">${item.box
        ? (item.score != null
            ? `detected as “${esc(item.label || item.name)}” at ${(item.score * 100).toFixed(0)}% confidence`
            : 'crop matched back into the source photo')
        : esc(boxCaption(run))}</p>
    </section>
    ${item.crop ? `<section>
      <h2>Cropped for reconstruction</h2>
      <img class="cropimg" src="${esc(item.crop.url)}" alt="">
      <p class="caption">${esc(item.crop.name)}${item.crop.width
        ? ` · ${item.crop.width}×${item.crop.height} px` : ''} · padded 6% so
        background removal has an edge to key against</p>
    </section>` : ''}
    ${flat ? `<section><h2>Reconstruction</h2>
      <p class="note">Skipped. Flat things stay flat: this crop is used directly as
      a textured panel of the target size, which is lighter and more faithful than
      a mesh of a picture.</p></section>` : meshBlock('Reconstructed mesh')}
    ${item.position ? `<section><h2>Placed in the room</h2>${kv([
      ['Position x', metres(item.position[0])],
      ['Position y', metres(item.position[1])],
      ['Position z', metres(item.position[2])],
      ['Target size', item.size.map(metres).join(' × ')],
      ['Rotation', (item.rotation_z || 0).toFixed(0) + '°'],
      ['Auto-orient', item.auto_orient ? 'yes' : 'no'],
      ['Kind', item.kind],
    ])}
    <p class="caption">Target size comes from a real-world size prior, not from the
    mesh — reconstruction returns everything in a unit cube. The assembler fits the
    mesh into this box.</p></section>` : ''}
    ${dropped ? `<p class="note bad">This object never made it into
      <b>${esc(run.render?.path || 'the scene')}</b>. It was detected and
      reconstructed, but the result had too few faces to place.</p>` : ''}`;
}

/* ---- selection ----------------------------------------------------- */
function selectRun(id, { push = true } = {}) {
  const run = runById(id);
  if (!run) return;
  state.runId = id;
  state.itemName = null;
  if (push) setHash();
  renderRuns(); renderStrip(); renderDetail();
  // For a lone .glb the run id *is* the file name, so repeating it says nothing.
  const sub = run.render && run.render.path !== run.id ? run.render.path
            : (run.photo ? `from ${run.photo.name}` : run.kind);
  $('crumb').innerHTML = `<b>${esc(run.id)}</b><small>${esc(sub)}</small>`;
  if (run.render) load(run.render.url, run.render.path, run.render.bytes);
  else showBlank(run.kind === 'images'
    ? 'No mesh in this folder — these are crops from a run that did not finish.'
    : 'This run has no assembled mesh yet.');
  renderDetail();
}

function selectItem(name, { push = true } = {}) {
  const run = currentRun();
  const item = run?.items.find((i) => i.name === name);
  if (!item) return;
  state.itemName = name;
  if (push) setHash();
  renderStrip(); renderDetail();
  $('crumb').innerHTML = `<b>${esc(run.id)}</b><small>/ ${esc(item.name)}</small>`;
  // A billboard's asset is its crop. An objects/<name>.glb may still be lying
  // about from before the flat-object rule existed, but showing it would claim
  // the scene contains geometry it does not.
  if (item.kind === 'billboard')
    showBlank(`${item.name} is a flat panel cut from its crop — the scene has no mesh for it.`);
  else if (item.mesh) load(item.mesh.url, item.name, item.mesh.bytes);
  else showBlank(`No mesh file for ${item.name}.`);
  renderDetail();
}

function showRender() {
  const run = currentRun();
  if (!run?.render) return;
  state.itemName = null;
  setHash();
  renderStrip(); renderDetail();
  const sub = run.render.path !== run.id ? run.render.path : 'assembled';
  $('crumb').innerHTML = `<b>${esc(run.id)}</b><small>${esc(sub)}</small>`;
  load(run.render.url, run.render.path, run.render.bytes);
}

$('runlist').addEventListener('click', (e) => {
  const el = e.target.closest('.run');
  if (el) selectRun(el.dataset.run);
});
$('stripscroll').addEventListener('click', (e) => {
  const el = e.target.closest('.step');
  if (!el) return;
  if (el.dataset.step === 'item') selectItem(el.dataset.name);
  else showRender();
});
addEventListener('hashchange', () => {
  if (suppressHash) { suppressHash = false; return; }
  route();
});

function route() {
  const raw = decodeURI(location.hash.slice(1));
  const cut = raw.lastIndexOf('/');
  // Run ids can contain slashes (a loose .glb in a subfolder), so try the whole
  // string as a run first and only then as run/item.
  if (runById(raw)) { selectRun(raw, { push:false }); return true; }
  if (cut > 0) {
    const [id, name] = [raw.slice(0, cut), raw.slice(cut + 1)];
    if (runById(id)) {
      selectRun(id, { push:false });
      selectItem(name, { push:false });
      return true;
    }
  }
  return false;
}

/* ---- polling ------------------------------------------------------- */
let canGenerate = false;

async function refresh() {
  const res = await fetch('/api/runs');
  const data = await res.json();
  $('where').textContent = data.root;
  state.runs = data.runs;
  canGenerate = !!data.can_generate;
  $('new').hidden = !canGenerate;

  // Rebuilding an unchanged list every five seconds would fight the scroll
  // position and restart every thumbnail decode.
  const sig = JSON.stringify(state.runs.map((r) => [r.id, r.render?.mtime,
    r.items.map((i) => [i.name, i.status, i.mesh?.mtime])]));
  if (sig === state.signature) return;
  state.signature = sig;

  const known = state.runId && runById(state.runId);
  renderRuns();
  if (known) { renderStrip(); renderDetail(); return; }   // keep what is open
  if (!route() && state.runs.length) selectRun(state.runs[0].id, { push:false });
  else if (!state.runs.length) showBlank('Nothing to show yet.');
}

/* ====================================================================
   toolbar, keys, drag-drop
   ==================================================================== */
function toggle(id, fn) {
  const b = $(id);
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    fn(on);
  });
}
toggle('t-rotate', (on) => { controls.autoRotate = on; });
toggle('t-wire',   (on) => { wireframe = on; applyWireframe(); });
toggle('t-grid',   (on) => { if (grid) grid.visible = on; });
toggle('t-bbox',   (on) => { if (box) box.visible = on; });
toggle('t-env',    (on) => { scene.background = on ? BACKDROP : VOID; });
$('t-fit').addEventListener('click', () => current && frameObject(current, true));
$('exposure').addEventListener('input', (e) => {
  renderer.toneMappingExposure = Number(e.target.value);
});

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  // Step through a run's objects without going back to the mouse.
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const run = currentRun();
    if (!run?.items.length) return;
    e.preventDefault();
    const at = run.items.findIndex((i) => i.name === state.itemName);
    const next = e.key === 'ArrowDown'
      ? Math.min(run.items.length - 1, at + 1)
      : Math.max(0, at - 1);
    selectItem(run.items[at < 0 ? 0 : next].name);
    return;
  }
  const map = { r:'t-rotate', w:'t-wire', g:'t-grid', b:'t-bbox', e:'t-env', f:'t-fit' };
  const id = map[e.key.toLowerCase()];
  if (id) { e.preventDefault(); $(id).click(); }
});

// Lets you check a mesh that lives outside the served directory without
// restarting the server against a different --dir.
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('dragging'); });
addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  // A mesh is something to look at; an image is something to build from.
  if (!/\.(glb|gltf)$/i.test(file.name)) {
    if (canGenerate && file.type.startsWith('image/')) return openCompose(file);
    return say(canGenerate ? `Not a mesh or an image: ${file.name}`
                           : `Not a glTF file: ${file.name}`, true);
  }
  state.runId = null; state.itemName = null;
  renderRuns(); renderStrip();
  $('detail').innerHTML = '';
  $('crumb').innerHTML = `<b>${esc(file.name)}</b><small>dropped</small>`;
  const url = URL.createObjectURL(file);
  load(url, file.name, file.size).finally(() => URL.revokeObjectURL(url));
});

/* ====================================================================
   generating: upload an image and run the pipeline on it
   ==================================================================== */
const OPTIONS = {
  object: [
    { key:'mc_resolution', label:'Marching cubes', type:'select',
      options:['192','256','320'], value:'256' },
    { key:'no_texture', label:'Texture', type:'select',
      options:[['', 'baked UV'], ['1', 'vertex colours']], value:'' },
  ],
  room: [
    { key:'fov', label:'Field of view °', type:'number', value:'85', step:'1' },
    { key:'threshold', label:'Detection', type:'number', value:'0.30', step:'0.05' },
    { key:'walls', label:'Walls', type:'select',
      options:['auto','all','none'], value:'auto' },
    { key:'decimate', label:'Decimate', type:'number', value:'', step:'0.1',
      placeholder:'off' },
    { key:'labels', label:'Look for (comma separated)', type:'text', value:'',
      placeholder:'defaults to a generic furniture list', full:true },
  ],
  cloud: [
    { key:'octree_resolution', label:'Detail', type:'select',
      options:[['256','256 · faster'], ['384','384 · default']], value:'384' },
    { key:'steps', label:'Diffusion steps', type:'number', value:'50', step:'5' },
    { key:'no_texture', label:'Texture', type:'select',
      options:[['', 'PBR material'], ['1', 'geometry only']], value:'' },
  ],
};

let chosenFile = null;
let jobKind = 'object';
const jobStates = new Map();     // id -> last state seen, to spot completions

function renderOptions() {
  $('opts').innerHTML = OPTIONS[jobKind].map((o) => {
    const body = o.type === 'select'
      ? `<select name="${o.key}">${o.options.map((opt) => {
          const [v, text] = Array.isArray(opt) ? opt : [opt, opt];
          return `<option value="${esc(v)}"${v === o.value ? ' selected' : ''}>${esc(text)}</option>`;
        }).join('')}</select>`
      : `<input name="${o.key}" type="${o.type}" value="${esc(o.value)}"
              ${o.step ? `step="${o.step}"` : ''}
              ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''}>`;
    return `<label class="${o.full ? 'full' : ''}">${esc(o.label)}${body}</label>`;
  }).join('');
}

const KINDS = ['object', 'room', 'cloud'];

function setKind(kind) {
  jobKind = kind;
  for (const k of KINDS) $('k-' + k).setAttribute('aria-pressed', String(kind === k));
  renderOptions();
}

function setFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    composeError(`${file.name} is not an image.`);
    return;
  }
  chosenFile = file;
  composeError('');
  const url = URL.createObjectURL(file);
  $('pickface').innerHTML =
    `<img src="${url}" alt=""><div style="margin-top:5px">${esc(file.name)} · ${
      (file.size / 1e6).toFixed(1)} MB</div>`;
  $('go').disabled = false;
  // A room photo is the obvious intent for anything wide; a cut-out object is
  // usually square. Only a nudge - the buttons still decide, and it fires only
  // from the default kind, so picking Cloud GPU and then dropping a wide image
  // does not silently reroute the job to the local room pipeline.
  const img = new Image();
  img.onload = () => {
    if (jobKind === 'object' && img.width > img.height * 1.35) setKind('room');
  };
  img.src = url;
}

function composeError(text) {
  $('composeerr').textContent = text;
  $('composeerr').hidden = !text;
}

function openCompose(file) {
  $('compose').classList.add('on');
  if (file) setFile(file);
}

$('new').addEventListener('click', () => {
  $('compose').classList.toggle('on');
});
for (const k of KINDS) $('k-' + k).addEventListener('click', () => setKind(k));
$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => setFile(e.target.files[0]));

$('compose').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!chosenFile) return;
  const opts = new URLSearchParams({ kind: jobKind });
  for (const el of $('opts').querySelectorAll('input,select'))
    if (el.value !== '') opts.set(el.name, el.value);

  $('go').disabled = true;
  composeError('');
  try {
    const res = await fetch('/api/generate?' + opts.toString(), {
      method: 'POST',
      // Filenames are not latin-1 safe, which is all a header may carry.
      headers: { 'X-Filename': encodeURIComponent(chosenFile.name) },
      body: chosenFile,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    $('compose').classList.remove('on');
    chosenFile = null;
    $('pickface').textContent = 'Drop an image, or click to choose';
    $('file').value = '';
    pollJobs();
  } catch (err) {
    composeError(err.message);
  } finally {
    $('go').disabled = !chosenFile;
  }
});

/* ---- job cards ----------------------------------------------------- */
const RUNNING = new Set(['queued', 'running']);

function renderJobs(jobs) {
  // Newest first, like the run list: the thing you just started is the thing
  // you are watching, and a long session should not push it off the bottom.
  $('joblist').innerHTML = jobs.slice().reverse().map((j) => {
    const active = RUNNING.has(j.state);
    const when = j.state === 'queued' ? `waiting ${j.waited}s`
      : `${j.elapsed}s${j.state === 'running' ? '' : ' · ' + j.state}`;
    return `
      <div class="job ${esc(j.state)}">
        <header>
          <img src="${esc(j.image_url)}" alt="">
          <div class="who"><b>${esc(j.image)}</b>
            <small>${esc(j.label)} · ${esc(when)}</small></div>
          ${active ? `<button data-cancel="${esc(j.id)}">Stop</button>`
                   : `<button data-dismiss="${esc(j.id)}">Hide</button>`}
        </header>
        ${j.stage ? `<div class="stage ${j.state === 'running' ? 'spin' : ''}">${esc(j.stage)}</div>` : ''}
        ${j.error ? `<div class="err">${esc(j.error)}</div>` : ''}
        ${active && j.log.length
          ? `<pre>${esc(j.log.slice(-6).join('\n'))}</pre>` : ''}
      </div>`;
  }).join('');
}

const hidden = new Set();

async function pollJobs() {
  let jobs;
  try {
    jobs = (await (await fetch('/api/jobs')).json()).jobs;
  } catch { return; }

  for (const j of jobs) {
    const was = jobStates.get(j.id);
    jobStates.set(j.id, j.state);
    // A finished job means new files on disk; go and look, then show the result.
    if (was && RUNNING.has(was) && !RUNNING.has(j.state)) {
      state.signature = '';
      await refresh().catch(() => {});
      if (j.state === 'done' && runById(j.run_id)) selectRun(j.run_id);
    }
  }
  renderJobs(jobs.filter((j) => !hidden.has(j.id)));
}

$('joblist').addEventListener('click', async (e) => {
  const stop = e.target.closest('[data-cancel]');
  if (stop) {
    await fetch(`/api/jobs/${stop.dataset.cancel}/cancel`, { method:'POST' })
      .catch(() => {});
    pollJobs();
    return;
  }
  const dismiss = e.target.closest('[data-dismiss]');
  if (dismiss) { hidden.add(dismiss.dataset.dismiss); pollJobs(); }
});

/* ---- loop ---------------------------------------------------------- */
function resize() {
  const { clientWidth: w, clientHeight: h } = canvas.parentElement;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

setKind('object');
refresh().catch((e) => say('Could not list runs: ' + e.message, true));
// New runs write into the same directory while this page is open.
setInterval(() => refresh().catch(() => {}), 5000);
// Faster while something is actually building, so the stage line keeps up.
let jobBeat = 0;
setInterval(() => {
  if (!canGenerate) return;
  const busy = [...jobStates.values()].some((s) => RUNNING.has(s));
  if (busy || jobBeat++ % 3 === 0) pollJobs();
}, 2000);
</script>
</body>
