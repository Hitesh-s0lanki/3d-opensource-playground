[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dioramic"
version = "0.3.0"
description = "Image to 3D: a FastAPI backend over a Modal GPU worker, plus the CLI."
requires-python = ">=3.10"
readme = "README.md"

# requirements.txt stays the single source of truth. It carries the reasoning
# behind every ceiling (transformers <5, numpy <2) and setup.ps1 installs from
# it directly, so duplicating the list here would guarantee the two drift apart.
dynamic = ["dependencies"]

# The Modal client is what the API uses to reach the GPU, but the CLI, the room
# pipeline and Blender assembly all work without it - and it is a heavy import -
# so it stays an extra:  uv pip install -e ".[modal]"
# services/modal_service.py imports it lazily and says so when it is missing.
[project.optional-dependencies]
modal = ["modal>=1.0"]

[project.scripts]
dioramic-generate = "src.cli.generate:main"
dioramic-room = "src.cli.room:main"
dioramic-assemble = "src.cli.assemble:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# `src` is the package, not a directory of packages: this is an application
# imported as `src.services.x` and run as `uvicorn src.main:app`, so the repo
# root is what goes on sys.path.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# build_scene.py is executed by Blender's own interpreter, never imported by
# ours, but it still has to ship inside the package so assembly_service.py can
# find it on disk next to the module that launches it.
[tool.setuptools.package-data]
"src.services.blender" = ["*.py"]
